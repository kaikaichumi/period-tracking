name: Flutter

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Compiles the iOS app (Swift, CocoaPods, Info.plist) without signing it.
  build-ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
